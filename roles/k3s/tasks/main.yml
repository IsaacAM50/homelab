---
- name: Comprobar si k3s ya está instalado
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Descargar el instalador de k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_bin.stat.exists

- name: Instalar k3s
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_EXEC: "{{ k3s_exec_args }}"
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_bin.stat.exists

- name: Esperar a que el apiserver responda
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 120
  when: not ansible_check_mode

- name: Crear el directorio .kube del usuario
  ansible.builtin.file:
    path: "/home/{{ lab_user }}/.kube"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0700"

- name: Copiar el kubeconfig al usuario
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ lab_user }}/.kube/config"
    remote_src: true
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"
  when: not ansible_check_mode

# Para que el mismo kubeconfig sirva desde la MacBook por Tailscale.
- name: Apuntar el kubeconfig al nombre de Tailscale en vez de a localhost
  ansible.builtin.replace:
    path: "/home/{{ lab_user }}/.kube/config"
    regexp: "https://127\\.0\\.0\\.1:6443"
    replace: "https://{{ inventory_hostname }}:6443"
  when: not ansible_check_mode

- name: Asegurar que k3s arranca con la máquina
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

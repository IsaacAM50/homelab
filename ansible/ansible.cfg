[defaults]
inventory            = inventory/
roles_path           = roles
host_key_checking    = False
# El callback 'yaml' de community.general se eliminó en su version 12.
# La forma actual es el callback por defecto con result_format=yaml.
stdout_callback         = default
callback_result_format  = yaml
callbacks_enabled    = ansible.posix.profile_tasks
interpreter_python   = auto_silent
retry_files_enabled  = False
display_skipped_hosts = False
# OJO: no pongas aquí vault_password_file. Si el fichero no existe,
# Ansible aborta antes de empezar y rompe un clon recién hecho y el CI.
# La clave se pasa por entorno: ver .envrc.example

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

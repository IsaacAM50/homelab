---
# Configura las VMs que creó OpenTofu. El inventario de máquinas sale de
# terraform/outputs.tf, no se escribe a mano.

- name: Base común a todas las máquinas
  hosts: k3s_server:k3s_agents
  become: true
  gather_facts: true

  pre_tasks:
    - name: Comprobar que la clave SSH está configurada
      ansible.builtin.assert:
        that:
          - lab_ssh_key is defined
          - "'cambia-esto' not in lab_ssh_key"
        fail_msg: >-
          Pon tu clave pública en inventory/group_vars/all.yml (lab_ssh_key).
          Sin eso, el rol de hardening te dejaría fuera de la máquina.
      tags: [always]

    - name: Comprobar que es Ubuntu
      ansible.builtin.assert:
        that: ansible_facts.distribution == "Ubuntu"
        fail_msg: "Este playbook está escrito para Ubuntu Server."
      tags: [always]

  roles:
    - role: base
      tags: [base]

    # Opcional: con el hipervisor anunciando la subred por Tailscale, las
    # VMs son alcanzables sin instalar Tailscale en cada una. Seis nodos
    # menos en tu cuenta.
    - role: tailscale
      tags: [tailscale, red]
      when: lab_tailscale_on_vms | bool

    - role: hardening
      tags: [hardening, seguridad]

    - role: docker
      tags: [docker, contenedores]

    - role: tooling
      tags: [tooling, herramientas]

# El servidor va en su propia obra porque publica el token que los
# agentes necesitan. Ansible solo propaga hechos entre obras si la del
# servidor ha corrido antes en la misma ejecución.
- name: Nodo servidor de k3s
  hosts: k3s_server
  become: true
  gather_facts: true
  roles:
    - role: k3s_server
      tags: [k3s, k3s_server]

- name: Nodos agente de k3s
  hosts: k3s_agents
  become: true
  gather_facts: true
  roles:
    - role: k3s_agent
      tags: [k3s, k3s_agent]

- name: Resumen
  hosts: k3s_server
  gather_facts: false
  tasks:
    - name: Cómo usar el clúster
      ansible.builtin.debug:
        msg:
          - "Clúster listo. Desde la MacBook:"
          - "  export KUBECONFIG={{ playbook_dir }}/../kubeconfig"
          - "  kubectl get nodes"
          - "Deberías ver {{ groups['k3s_agents'] | length + 1 }} nodos."
      tags: [always]

---
# Orden importante: el cortafuegos se abre ANTES de cerrar el SSH por
# contraseña. Al revés te quedas fuera de tu propia máquina, y es el error
# más repetido de todo el homelab.
- name: Instalar ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Permitir SSH desde la red de casa
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ lab_lan_cidr }}"
    comment: "SSH desde la LAN (seguro por si Tailscale falla)"

- name: Permitir todo el tráfico de la interfaz de Tailscale
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    comment: "Red privada Tailscale"

# Sin esto el clúster se levanta y NO funciona: los nodos se ven en la red
# pero el cortafuegos corta el tráfico entre ellos. El síntoma engaña —
# los nodos aparecen en 'kubectl get nodes' como NotReady, y los pods se
# quedan en Pending sin decir por qué.
#
# La API ya entra por tailscale0 gracias a la regla de arriba; estas son
# para que los nodos hablen entre sí por la LAN.
- name: Permitir el tráfico interno del clúster k3s
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ lab_lan_cidr }}"
    comment: "k3s: {{ item.why }}"
  loop:
    - port: "6443"
      proto: tcp
      why: "apiserver, lo llaman los agentes"
    - port: "8472"
      proto: udp
      why: "flannel VXLAN, la red de pods"
    - port: "10250"
      proto: tcp
      why: "kubelet, metricas y exec"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  when: "'k3s_server' in group_names or 'k3s_agents' in group_names"

- name: Denegar el resto del tráfico entrante y activar ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Permitir todo el tráfico saliente
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Endurecer la configuración de SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*{{ item.k }}"
    line: "{{ item.k }} {{ item.v }}"
    state: present
    validate: "sshd -t -f %s"
  loop:
    - k: PasswordAuthentication
      v: "no"
    - k: KbdInteractiveAuthentication
      v: "no"
    - k: PermitRootLogin
      v: "no"
    - k: X11Forwarding
      v: "no"
    - k: MaxAuthTries
      v: "3"
    - k: ClientAliveInterval
      v: "300"
  loop_control:
    label: "{{ item.k }}"
  notify: Reiniciar sshd

# Ubuntu 24.04+ reparte la config en ficheros sueltos que pueden volver a
# activar la contraseña después de lo anterior. Esto los desactiva.
- name: Buscar fragmentos de configuración que reactiven la contraseña
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
    contains: "^\\s*PasswordAuthentication\\s+yes"
  register: hardening_ssh_drop_ins

- name: Neutralizar esos fragmentos
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: "^(\\s*PasswordAuthentication\\s+)yes"
    replace: "\\1no"
    validate: "sshd -t -f /etc/ssh/sshd_config"
  loop: "{{ hardening_ssh_drop_ins.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reiniciar sshd

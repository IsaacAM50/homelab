---
- name: Comprobar si k3s ya está instalado
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_server_bin

- name: Descargar el instalador de k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_server_bin.stat.exists

- name: Instalar el nodo servidor
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_EXEC: >-
      server {{ k3s_exec_args }}
      --tls-san={{ ansible_facts.default_ipv4.address }}
      --node-ip={{ ansible_facts.default_ipv4.address }}
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_server_bin.stat.exists

- name: Esperar a que el apiserver responda
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 180
  when: not ansible_check_mode

- name: Leer el token que necesitan los agentes
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_token_raw
  when: not ansible_check_mode

# Lo publica como hecho del host para que la obra de los agentes lo lea
# con hostvars. Así el token nunca se escribe en disco de la MacBook.
- name: Publicar el token para la obra de los agentes
  ansible.builtin.set_fact:
    k3s_server_node_token: "{{ k3s_server_token_raw.content | b64decode | trim }}"
  when: not ansible_check_mode
  no_log: true

- name: Crear el directorio .kube del usuario
  ansible.builtin.file:
    path: "/home/{{ lab_user }}/.kube"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0700"

- name: Leer el kubeconfig que genera k3s
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_server_kubeconfig_raw
  when: not ansible_check_mode

# Se transforma y se escribe en UNA tarea, no copiando y luego editando.
#
# Con dos tareas se pelean: 'copy' restaura el original con 127.0.0.1,
# 'replace' lo cambia por la IP, y en la siguiente pasada 'copy' ve que el
# destino difiere del origen y vuelve a copiar. Dos 'changed' por ejecución,
# para siempre, sin que nada esté realmente mal.
#
# Escribiendo el contenido ya transformado, el resultado es determinista y
# 'copy' compara hashes: la segunda pasada no toca nada.
#
# El cambio de 127.0.0.1 por la IP es lo que hace que el mismo fichero
# sirva desde la MacBook y no solo dentro del nodo.
- name: Escribir el kubeconfig del usuario apuntando a la IP del nodo
  ansible.builtin.copy:
    content: >-
      {{ k3s_server_kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443',
                   'https://' ~ ansible_facts.default_ipv4.address ~ ':6443') }}
    dest: "/home/{{ lab_user }}/.kube/config"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"
  when: not ansible_check_mode

- name: Traerse el kubeconfig a la MacBook
  ansible.builtin.fetch:
    src: "/home/{{ lab_user }}/.kube/config"
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true
  when: not ansible_check_mode

- name: Asegurar que k3s arranca con la máquina
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

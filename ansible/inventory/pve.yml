---
# El hipervisor. Es el único host que se escribe a mano: todo lo demás
# (las VMs) lo genera OpenTofu en inventory/vms.yml.
#
# Pon aquí la IP que te enseña la consola de Proxmox al arrancar, o su
# nombre de Tailscale una vez lo hayas dado de alta.
pve:
  hosts:
    pve:
      ansible_host: 192.168.1.50
      ansible_user: root

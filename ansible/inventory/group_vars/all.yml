---
# ─── Usuario ────────────────────────────────────────────────────────────
lab_user: isaac
lab_user_shell: /bin/bash
lab_timezone: Europe/Madrid

# Clave pública con la que entras desde la MacBook.
# Sácala con: cat ~/.ssh/id_ed25519.pub
lab_ssh_key: "ssh-ed25519 AAAA... cambia-esto"

# ─── Red ────────────────────────────────────────────────────────────────
# Subred de casa. Se permite SSH desde aquí ADEMÁS de por Tailscale,
# como seguro contra quedarte fuera si Tailscale falla.
#
# Se detecta sola a partir de la interfaz por defecto del equipo. Escribir
# la subred a mano es el camino corto a cerrarte el SSH: basta con que el
# router reparta en 192.168.0.x y tú hayas puesto 192.168.1.x.
# Para fijarla a mano, sobrescribe esta variable con el CIDR que quieras.
lab_lan_cidr: "{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.prefix | default('24') }}"

# ─── Repositorios apt ───────────────────────────────────────────────────
# Docker y Tailscale publican por nombre en clave de Ubuntu. Si tu versión
# es muy nueva y aún no tiene repo propio, fija aquí la anterior LTS.
apt_release: "{{ ansible_distribution_release }}"

# ─── Versiones de herramientas (mise las fija, no 'la última') ──────────
tool_versions:
  terraform: "1.13.3"
  opentofu: "1.10.6"
  kubectl: "1.34.1"
  helm: "3.19.0"
  k9s: "0.50.9"
  kustomize: "5.7.1"
  argocd: "3.1.5"
  yq: "4.47.1"

# ─── k3s ────────────────────────────────────────────────────────────────
# Qué nodo es servidor y cuáles agentes lo decide el grupo del inventario,
# que genera OpenTofu. Aquí solo van los argumentos del servidor.
#
# Traefik fuera: en R1 instalas tu propio ingress o Gateway API.
# servicelb fuera: usarás MetalLB, que es lo que se parece a la realidad.
k3s_exec_args: "--disable=traefik --disable=servicelb --write-kubeconfig-mode=0644"

# ─── Tailscale dentro de las VMs ────────────────────────────────────────
# Por defecto NO. El hipervisor anuncia la subred entera por Tailscale, así
# que las VMs son alcanzables desde la MacBook sin instalar nada en cada
# una. Ponlo a true solo si quieres que cada VM sea un nodo del tailnet.
lab_tailscale_on_vms: false
